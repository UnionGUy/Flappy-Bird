<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    canvas {
      border: 3px solid #fff;
      border-radius: 10px;
      background: #70c5ce;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="game" width="360" height="540"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const GRAVITY = 0.42;
    const JUMP = -7.4;
    const PIPE_SPEED = 2.4;
    const PIPE_WIDTH = 54;
    const PIPE_GAP = 135;
    const PIPE_SPAWN_FRAMES = 95;
    const GROUND_HEIGHT = 70;

    let frames = 0;
    let score = 0;
    let bestScore = Number(localStorage.getItem("flappyBest") || 0);
    let gameState = "ready"; // "ready" | "playing" | "gameover"
    let pipes = [];

    const bird = {
      x: 80,
      y: canvas.height / 2 - 20,
      radius: 14,
      vy: 0,
      reset() {
        this.y = canvas.height / 2 - 20;
        this.vy = 0;
      },
      flap() {
        this.vy = JUMP;
      },
      update() {
        this.vy += GRAVITY;
        this.y += this.vy;

        if (this.y - this.radius < 0) {
          this.y = this.radius;
          this.vy = 0;
        }

        if (this.y + this.radius >= canvas.height - GROUND_HEIGHT) {
          this.y = canvas.height - GROUND_HEIGHT - this.radius;
          endGame();
        }
      },
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        const angle = Math.min(Math.max(this.vy * 0.06, -0.45), 1.1);
        ctx.rotate(angle);

        // Bird body
        ctx.fillStyle = "#ffd166";
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#333";
        ctx.stroke();

        // Eye
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(5, -4, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(6.5, -4, 2, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = "#f77f00";
        ctx.beginPath();
        ctx.moveTo(11, -1);
        ctx.lineTo(20, 2);
        ctx.lineTo(11, 6);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }
    };

    function spawnPipe() {
      const minTop = 50;
      const maxTop = canvas.height - GROUND_HEIGHT - PIPE_GAP - 50;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
      pipes.push({
        x: canvas.width,
        topHeight,
        passed: false
      });
    }

    function updatePipes() {
      if (frames % PIPE_SPAWN_FRAMES === 0) {
        spawnPipe();
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= PIPE_SPEED;

        const hitX = bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH;
        const hitTop = bird.y - bird.radius < p.topHeight;
        const hitBottom = bird.y + bird.radius > p.topHeight + PIPE_GAP;

        if (hitX && (hitTop || hitBottom)) {
          endGame();
        }

        if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
          p.passed = true;
          score++;
          if (score > bestScore) {
            bestScore = score;
            localStorage.setItem("flappyBest", bestScore);
          }
        }

        if (p.x + PIPE_WIDTH < 0) {
          pipes.splice(i, 1);
        }
      }
    }

    function drawPipes() {
      ctx.fillStyle = "#2ec4b6";
      ctx.strokeStyle = "#1b4332";
      ctx.lineWidth = 2;

      for (const p of pipes) {
        // Top pipe
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topHeight);
        ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.topHeight);

        // Bottom pipe
        const bottomY = p.topHeight + PIPE_GAP;
        const bottomH = canvas.height - GROUND_HEIGHT - bottomY;
        ctx.fillRect(p.x, bottomY, PIPE_WIDTH, bottomH);
        ctx.strokeRect(p.x, bottomY, PIPE_WIDTH, bottomH);
      }
    }

    function drawGround() {
      ctx.fillStyle = "#ded99f";
      ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
      ctx.fillStyle = "#70e000";
      ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, 14);
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - GROUND_HEIGHT);
      ctx.lineTo(canvas.width, canvas.height - GROUND_HEIGHT);
      ctx.stroke();
    }

    function drawHUD() {
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 4;
      ctx.font = "bold 36px system-ui, sans-serif";
      ctx.textAlign = "center";

      if (gameState === "playing") {
        ctx.strokeText(score, canvas.width / 2, 60);
        ctx.fillText(score, canvas.width / 2, 60);
      } else if (gameState === "ready") {
        ctx.font = "bold 28px system-ui, sans-serif";
        ctx.strokeText("FLAPPY BIRD", canvas.width / 2, 150);
        ctx.fillText("FLAPPY BIRD", canvas.width / 2, 150);
        ctx.font = "bold 18px system-ui, sans-serif";
        ctx.strokeText("Click or Press Space to Flap", canvas.width / 2, 200);
        ctx.fillText("Click or Press Space to Flap", canvas.width / 2, 200);
      } else if (gameState === "gameover") {
        ctx.font = "bold 32px system-ui, sans-serif";
        ctx.strokeText("GAME OVER", canvas.width / 2, 150);
        ctx.fillText("GAME OVER", canvas.width / 2, 150);

        ctx.font = "bold 20px system-ui, sans-serif";
        ctx.strokeText(`Score: ${score}`, canvas.width / 2, 200);
        ctx.fillText(`Score: ${score}`, canvas.width / 2, 200);
        ctx.strokeText(`Best: ${bestScore}`, canvas.width / 2, 232);
        ctx.fillText(`Best: ${bestScore}`, canvas.width / 2, 232);

        ctx.font = "bold 17px system-ui, sans-serif";
        ctx.strokeText("Click or Press Space to Restart", canvas.width / 2, 285);
        ctx.fillText("Click or Press Space to Restart", canvas.width / 2, 285);
      }
    }

    function endGame() {
      if (gameState !== "gameover") {
        gameState = "gameover";
      }
    }

    function resetGame() {
      bird.reset();
      pipes = [];
      score = 0;
      frames = 0;
      gameState = "playing";
      bird.flap();
    }

    function handleInput() {
      if (gameState === "ready") {
        gameState = "playing";
        bird.flap();
      } else if (gameState === "playing") {
        bird.flap();
      } else if (gameState === "gameover") {
        resetGame();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        handleInput();
      }
    });

    canvas.addEventListener("pointerdown", handleInput);

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameState === "playing") {
        frames++;
        bird.update();
        updatePipes();
      } else if (gameState === "ready") {
        bird.y = canvas.height / 2 - 20 + Math.sin(Date.now() / 180) * 6;
      }

      drawPipes();
      drawGround();
      bird.draw();
      drawHUD();

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
